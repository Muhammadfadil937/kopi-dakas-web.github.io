<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOPI DAKAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.header{background:#0a8dff;padding:14px 20px;display:flex;justify-content:space-between}
.logo{background:red;color:white;padding:8px 14px;border-radius:14px;font-weight:900}
.banner{margin:16px;background:red;border:4px solid #0a8dff;border-radius:32px;padding:60px 20px;text-align:center;color:white;font-size:32px;font-weight:900}
.btn{background:#0a8dff;color:white;padding:14px 32px;border-radius:30px;border:none;font-weight:bold;margin:20px auto;display:block}
.blue{background:#0a8dff;color:white;text-align:center;padding:60px 20px;margin-top:20px;font-size:28px;font-weight:900}
</style>
</head>
<body>
<div class="header"><div class="logo">KOPI<br>DAKAS</div><div style="color:white">🛒</div></div>
<div class="banner">☕ KOPI DAKAS<br>YANG PALING<br>MEMAHAMI</div>
<button class="btn">Lihat Menu</button>
<div class="blue">Layanan Pengiriman &<br>Pengambilan</div>
</body>
</html>
