<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOPI DAKAS - Yang Paling Memahami</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f7fb;color:#111}
.top{position:sticky;top:0;z-index:99;background:#0d8bf2;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px}
.logo span{font-weight:400;font-size:11px;display:block;opacity:.9}
.menu-wrap{max-width:480px;margin:0 auto;padding:12px}
.search{background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
.search input{border:0;outline:0;width:100%;font-size:14px}
.title{font-weight:900;font-size:28px;margin:8px 4px}
.sub{font-size:13px;color:#6b7a90;margin:0 4px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.07);border:1px solid #eef2fb;position:relative}
.badge{position:absolute;top:10px;right:10px;background:#0a3d8f;color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px}
.card img{width:100%;height:110px;object-fit:contain}
.card h3{font-size:13px;margin-top:8px;line-height:1.2}
.card p{font-size:11px;color:#6b7a90}
.btn{margin-top:8px;width:100%;background:#00b14f;color:#fff;border:0;padding:8px;border-radius:20px;font-weight:700;font-size:12px;display:flex;justify-content:center;gap:6px}
.cart{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:14px 22px;border-radius:30px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:700}
</style>
</head>
<body>
<div class="top">
<div class="logo">KOPI DAKAS<span>YANG PALING MEMAHAMI</span></div>
<div style="font-size:20px">🛒<b id="jml" style="background:red;border-radius:50%;padding:2px 6px;font-size:11px;position:relative;top:-10px">0</b></div>
</div>
<div class="menu-wrap">
<div class="search">🔍<input placeholder="Cari menu Kopi Dakas..."></div>
<div class="title">MENU</div>
<div class="sub">Semua Menu • 8 Produk • Estimasi 20-30 menit</div>
<div class="grid" id="grid"></div>
</div>
<div class="cart" id="cartBtn" onclick="checkout()">🛒 <span id="total">0 item</span> • Pesan Sekarang</div>
<script>
const wa="6282274666353";
const produk=[
{n:"Kopi Dakas Klasik",d:"Double Shot Espresso",h:13000,i:"☕"},
{n:"Kopi Susu Strong",d:"Balance Flavor",h:13000,i:"🥤"},
{n:"Kopi Susu Soft",d:"Balance Sweet Flavor",h:13000,i:"🧋"},
{n:"Kopi Dakas Literan 1L",d:"1 Liter • Botol",h:95000,i:"🍶"},
{n:"Coldbrew Peach",d:"Segar • Peach",h:15000,i:"🧊"},
{n:"Matcha",d:"Creamy • Matcha",h:13000,i:"🍵"},
{n:"Chocolate",d:"Rich Chocolate",h:13000,i:"🍫"},
{n:"Kopi Dakas 500mL",d:"500 mL • Botol",h:49000,i:"🧴"},
];
let keranjang=[];
function render(){
document.getElementById('grid').innerHTML=produk.map((p,idx)=>`
<div class="card">
<div class="badge">${p.h>=95000?'95K':p.h>=49000?'49K':p.h>=15000?'15K':'13K'}</div>
<div style="font-size:60px;text-align:center">${p.i}</div>
<h3>${p.n}</h3>
<p>${p.d}</p>
<button class="btn" onclick="add(${idx})">💬 Pesan WA</button>
</div>`).join('');
}
function add(i){
keranjang.push(produk[i]);
document.getElementById('jml').innerText=keranjang.length;
document.getElementById('total').innerText=keranjang.length+' item';
let txt=`Halo Kopi Dakas, mau pesan ${produk[i].n} Rp ${produk[i].h.toLocaleString()}`;
window.open(`https://wa.me/${wa}?text=${encodeURIComponent(txt)}`,'_blank');
}
function checkout(){
if(!keranjang.length)return alert('Keranjang kosong');
let list=keranjang.map(k=>`- ${k.n} ${k.h}`).join('%0A');
window.open(`https://wa.me/${wa}?text=Halo%20Kak,%20mau%20pesan:%0A${list}`,'_blank');
}
render();
</script>
</body>
</html>
