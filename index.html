<!DOCTYPE html>
<html lang="id">
<head>

<title>KOPI DAKAS 5</title>
<style>

</head>
<body>
<div class="header">
  <img src="logo.jpg" onerror="this.style.display='none'">

</div>
<div class="menu">
  <div class="card"><img src="klasik.jpg"><div class="info"><b>Klasik</b><div class="price">13K</div><button class="btn" onclick="pesan('Klasik')">PESAN</button></div></div>
  <div class="card"><img src="soft.jpg"><div class="info"><b>Soft</b><div class="price">13K</div><button class="btn" onclick="pesan('Soft')">PESAN</button></div></div>
  <div class="card"><img src="strong.jpg"><div class="info"><b>Strong</b><div class="price">13K</div><button class="btn" onclick="pesan('Strong')">PESAN</button></div></div>
  <div class="card"><img src="matcha.jpg"><div class="info"><b>Matcha</b><div class="price">13K</div><button class="btn" onclick="pesan('Matcha')">PESAN</button></div></div>
  <div class="card"><img src="coklat.jpg"><div class="info"><b>Coklat</b><div class="price">13K</div><button class="btn" onclick="pesan('Coklat')">PESAN</button></div></div>
  <div class="card"><img src="cold brew.jpg"><div class="info"><b>Cold Brew</b><div class="price">15K</div><button class="btn" onclick="pesan('Cold Brew')">PESAN</button></div></div>
</div>
<script>
function pesan(m){
  window.open("https://wa.me/6283132891180?text=Halo%20Kopi%20Dakas%205%20mau%20pesan%20"+m,"_blank");
}
</script>
</body>
</html>
