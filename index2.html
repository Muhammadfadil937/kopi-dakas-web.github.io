<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b4a9c;display:flex;justify-content:center}
.board{width:100%;max-width:440px;background:linear-gradient(#3aa0ff,#1576d6 30%,#0e5bb5);min-height:100vh;position:relative;padding:18px 14px 90px 12px;overflow:hidden}
.vertical{position:absolute;right:8px;top:18px;writing-mode:vertical-rl;font-family:Anton,sans-serif;font-size:82px;color:white;letter-spacing:4px;line-height:1;text-shadow:3px 3px 0 #082a5a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-right:84px}
.item{background:linear-gradient(180deg,#1f4a8a,#1a6fcd);border-radius:14px;padding:7px;position:relative;min-height:130px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.label{font-family:Inter,sans-serif;font-weight:900;font-size:8px;color:white;text-transform:uppercase;line-height:1.1}
.label span{font-size:6px;opacity:.8;font-weight:800}
.item img{width:90%;max-height:82px;object-fit:contain;display:block;margin:6px auto 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.price{position:absolute;bottom:-4px;right:-4px;background:#0a2040;color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border:2px solid #7cc4ff}
.liter{margin-right:84px;margin-top:12px;background:#5bbcff;border-radius:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.liter .bottle{background:rgba(0,0,0,.1);border-radius:12px;padding:6px;display:flex;align-items:center;gap:4px;position:relative}
.liter img{width:58px}
.liter .lbl{font-size:7px;font-weight:900;line-height:1;color:#0a2040}
.logo{position:absolute;right:6px;bottom:92px;text-align:right;color:white;font-family:Anton,sans-serif;line-height:.9}
.logo small{font-family:Inter;font-size:6.5px;letter-spacing:1px;font-weight:900}
.wa{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;background:#0a2040;display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.wa a{background:#25D366;color:white;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:900;font-size:12px}
</style>
</head>
